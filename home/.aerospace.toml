# ┌─────────────────────────────────────────────────────────┐
# │ CHEATSHEET (AZERTY Mac)                                 │
# │                                                         │
# │ Persistent workspaces: 1-9                              │
# │                                                         │
# │ Keybindings are managed by skhd (~/.skhdrc)             │
# │ using left alt as sole modifier.                        │
# │ Right alt passes through for AZERTY special chars.      │
# │                                                         │
# │ Mode "service" - juste la touche (revient en main auto) │
# │   ECHAP       : Reload config                           │
# │   R           : Reset layout du workspace               │
# │   F           : Toggle float/tiling                     │
# │                 (astuce: float+unfloat Ghostty fix      │
# │                  partiellement le bug des tabs)         │
# │   BACKSPACE   : Fermer toutes les fenetres sauf active  │
# │                                                         │
# │ Mode "shortcuts" - juste la touche (revient en main)    │
# │   D           : Dodo (sleep)                            │
# │   L           : Lock écran                              │
# │   S           : Restart sketchybar                      │
# │   M           : Toggle mute micro                       │
# └─────────────────────────────────────────────────────────┘


# Place a copy of this config to ~/.aerospace.toml
# After that, you can edit ~/.aerospace.toml to your liking

# Config version for compatibility and deprecations
# Fallback value (if you omit the key): config-version = 1
config-version = 2

# You can use it to add commands that run after AeroSpace startup.
# Available commands : https://nikitabobko.github.io/AeroSpace/commands
after-startup-command = [
    'exec-and-forget borders active_color="glow(0xFFE1A860)" inactive_color="0x00000000" width=6.0 style=round hidpi=on',
    'exec-and-forget pgrep -x sketchybar || sketchybar',
    'exec-and-forget rm -f ~/.cache/workspace-summarizer/enabled ~/.cache/workspace-summarizer/cost.session ~/.cache/workspace-summarizer/tokens.session',
]

# Notify SketchyBar about workspace change
exec-on-workspace-change = ['/bin/bash', '-c',
    'if [ -n "$AEROSPACE_PREV_WORKSPACE" ] && [ "$AEROSPACE_PREV_WORKSPACE" != "$AEROSPACE_FOCUSED_WORKSPACE" ]; then echo "$AEROSPACE_PREV_WORKSPACE" > /tmp/aerospace-prev-workspace; fi; sketchybar --trigger aerospace_workspace_change FOCUSED_WORKSPACE=$AEROSPACE_FOCUSED_WORKSPACE; [ ! -f ~/.config/workspace-summarizer/disabled ] && ~/.local/bin/workspace-summarizer-trigger &'
]

# Start AeroSpace at login
start-at-login = true

# Normalizations. See: https://nikitabobko.github.io/AeroSpace/guide#normalization
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# See: https://nikitabobko.github.io/AeroSpace/guide#layouts
# The 'accordion-padding' specifies the size of accordion padding
# You can set 0 to disable the padding feature
accordion-padding = 60

# Possible values: tiles|accordion
default-root-container-layout = 'tiles'

# Possible values: horizontal|vertical|auto
# 'auto' means: wide monitor (anything wider than high) gets horizontal orientation,
#               tall monitor (anything higher than wide) gets vertical orientation
default-root-container-orientation = 'auto'

# Mouse follows focus when focused monitor changes
# Drop it from your config, if you don't like this behavior
# See https://nikitabobko.github.io/AeroSpace/guide#on-focus-changed-callbacks
# See https://nikitabobko.github.io/AeroSpace/commands#move-mouse
# Fallback value (if you omit the key): on-focused-monitor-changed = []
on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
# NEW TEST : on va encore plus loin
on-focus-changed = ['move-mouse window-lazy-center', 'exec-and-forget bash -c "[ ! -f ~/.config/workspace-summarizer/disabled ] && ~/.local/bin/workspace-summarizer-trigger"']

# You can effectively turn off macOS "Hide application" (cmd-h) feature by toggling this flag
# Useful if you don't use this macOS feature, but accidentally hit cmd-h or cmd-alt-h key
# Also see: https://nikitabobko.github.io/AeroSpace/goodies#disable-hide-app
automatically-unhide-macos-hidden-apps = true

# List of workspaces that should stay alive even when they contain no windows,
# even when they are invisible.
# This config version is only available since 'config-version = 2'
# Fallback value (if you omit the key): persistent-workspaces = []
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]#,
#                         "C", "D", "E", "F", "G", "I", "M", "N", "O", "P", "Q",
#                         "R", "S", "T", "U", "V", "W", "X", "Y", "Z"]

# A callback that runs every time binding mode changes
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# See: https://nikitabobko.github.io/AeroSpace/commands#mode
on-mode-changed = []

# Possible values: (qwerty|dvorak|colemak)
# See https://nikitabobko.github.io/AeroSpace/guide#key-mapping
[key-mapping]
    preset = 'qwerty'

# Gaps between windows (inner-*) and between monitor edges (outer-*).
# Possible values:
# - Constant:     gaps.outer.top = 8
# - Per monitor:  gaps.outer.top = [{ monitor.main = 16 }, { monitor."some-pattern" = 32 }, 24]
#                 In this example, 24 is a default value when there is no match.
#                 Monitor pattern is the same as for 'workspace-to-monitor-force-assignment'.
#                 See:
#                 https://nikitabobko.github.io/AeroSpace/guide#assign-workspaces-to-monitors
[gaps]
    inner.horizontal = 10 #30
    inner.vertical =   0 #30
    outer.left =       10 #30
    outer.bottom =     10 #30
    outer.top =        [{ monitor."Built-in.*" = 5 }, 40] # SketchyBar height
    outer.right =      10 #30

# 'main' binding mode declaration
# All keybindings are managed by skhd (~/.skhdrc) — this section is intentionally empty.
[mode.main.binding]

# 'service' binding mode declaration.
# See: https://nikitabobko.github.io/AeroSpace/guide#binding-modes
# Keep shortcuts in sync with ~/.config/sketchybar/service.txt
[mode.service.binding]
    esc = ['reload-config', 'mode main', 'exec-and-forget sketchybar --reload']
    r = ['flatten-workspace-tree', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main'] # reset layout
    f = ['layout floating tiling', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main'] # Toggle between floating and tiling layout
    backspace = ['close-all-windows-but-current', 'mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']

    # join-with bindings moved to skhd (lalt+shift+cmd+zqsd, always available)

# 'shortcuts' binding mode declaration.
# Keep shortcuts in sync with ~/.config/sketchybar/shortcuts.txt
[mode.shortcuts.binding]
    esc = ['mode main', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
    b = ['mode main', 'exec-and-forget ~/.local/bin/new-brave-window', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
    g = ['mode main', 'exec-and-forget ~/.local/bin/new-ghostty-window', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main']
    d = ['mode main', 'exec-and-forget pmset sleepnow', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main'] # dodo (sleep)
    l = ['mode main', 'exec-and-forget pmset displaysleepnow', 'exec-and-forget sketchybar --trigger aerospace_mode_change MODE=main'] # lock écran
    s = ['mode main', 'exec-and-forget killall sketchybar; sleep 1; sketchybar &'] # restart sketchybar
    # TOUCHE "M" pour toggle mute micro
    #   - (m AZERTY = semicolon QWERTY)
    semicolon = ['mode main', 'exec-and-forget SENDER=mouse.clicked NAME=mic ~/.config/sketchybar/plugins/mic.sh; sketchybar --trigger aerospace_mode_change MODE=main'] # toggle mic mute

# Force tiling for undecorated Tauri windows that AeroSpace floats by default
[[on-window-detected]]
if.app-name-regex-substring = "claude-jira-agent"
run = "layout tiling"

# Trigger workspace summarizer on any new window (if AI naming not disabled)
[[on-window-detected]]
run = 'exec-and-forget bash -c "[ ! -f ~/.config/workspace-summarizer/disabled ] && ~/.local/bin/workspace-summarizer-trigger"'
